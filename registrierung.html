<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrierung – Pizza Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="startseite.html">🍕 Pizza Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item"><a class="nav-link" href="startseite.html">Startseite</a></li>
        <li class="nav-item"><a class="nav-link" href="konfigurator.html">Konfigurator</a></li>
        <li class="nav-item d-none" data-auth-user><a class="nav-link" href="meine-pizzen.html">Meine Pizzen</a></li>
        <li class="nav-item" data-auth-guest><a class="btn btn-light btn-sm ms-lg-2" href="login.html">Anmelden</a></li>
        <li class="nav-item d-none" data-auth-user><a class="btn btn-outline-light btn-sm ms-lg-2" href="#" data-action="logout" data-user-name>Abmelden</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-5"><div class="card border-0 shadow-sm form-card"><div class="card-body p-4 p-md-5"><h1 class="h2 fw-bold mb-2">Konto erstellen</h1><p class="text-secondary mb-4">Nach der Registrierung bist du direkt angemeldet.</p><div id="registerAlert" class="d-none" role="alert"></div><form id="registerForm" class="row g-3"><div class="col-md-6"><label class="form-label">Vorname *</label><input class="form-control" name="vorname" required></div><div class="col-md-6"><label class="form-label">Nachname *</label><input class="form-control" name="nachname" required></div><div class="col-12"><label class="form-label">E-Mail-Adresse *</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Passwort *</label><input class="form-control" type="password" name="passwort" minlength="6" required></div><div class="col-md-6"><label class="form-label">Passwort bestätigen *</label><input class="form-control" type="password" name="passwort_bestaetigung" minlength="6" required></div><div class="col-md-8"><label class="form-label">Straße *</label><input class="form-control" name="strasse" required></div><div class="col-md-4"><label class="form-label">Hausnummer *</label><input class="form-control" name="hausnummer" required></div><div class="col-md-4"><label class="form-label">PLZ *</label><input class="form-control" name="plz" required></div><div class="col-md-8"><label class="form-label">Stadt *</label><input class="form-control" name="stadt" required></div><div class="col-12"><label class="form-label">Telefon <span class="text-secondary">(optional)</span></label><input class="form-control" name="telefon" type="tel"></div><div class="col-12"><button class="btn btn-danger w-100" type="submit">Registrieren</button></div></form></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/auth.js"></script><script src="js/registrierung.js"></script></body></html>

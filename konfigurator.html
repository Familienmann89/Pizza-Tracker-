<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfigurator – Pizza Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="startseite.html">🍕 Pizza Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item"><a class="nav-link" href="startseite.html">Startseite</a></li>
        <li class="nav-item"><a class="nav-link" href="konfigurator.html">Konfigurator</a></li>
        <li class="nav-item d-none" data-auth-user><a class="nav-link" href="meine-pizzen.html">Meine Pizzen</a></li>
        <li class="nav-item" data-auth-guest><a class="btn btn-light btn-sm ms-lg-2" href="login.html">Anmelden</a></li>
        <li class="nav-item d-none" data-auth-user><a class="btn btn-outline-light btn-sm ms-lg-2" href="#" data-action="logout" data-user-name>Abmelden</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-5"><div class="row g-4"><div class="col-lg-7"><h1 class="fw-bold mb-1">Pizza konfigurieren</h1><p class="text-secondary mb-4">Preis und Kalorien aktualisieren sich direkt.</p><div class="mb-4"><label class="form-label fw-semibold" for="pizzaName">Name der Pizza</label><input id="pizzaName" class="form-control" maxlength="100" value="Meine Pizza"></div>
<div class="accordion" id="configAccordion">
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#sizePane">1. Größe *</button></h2><div id="sizePane" class="accordion-collapse collapse show"><div class="accordion-body"><div id="groesseOptions" class="option-grid"></div></div></div></div>
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#doughPane">2. Teig *</button></h2><div id="doughPane" class="accordion-collapse collapse"><div class="accordion-body"><div id="teigOptions" class="option-grid"></div></div></div></div>
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#saucePane">3. Sauce *</button></h2><div id="saucePane" class="accordion-collapse collapse"><div class="accordion-body"><div id="sauceOptions" class="option-grid"></div></div></div></div>
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cheesePane">4. Käse *</button></h2><div id="cheesePane" class="accordion-collapse collapse"><div class="accordion-body"><div id="kaeseOptions" class="option-grid"></div></div></div></div>
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#toppingPane">5. Beläge</button></h2><div id="toppingPane" class="accordion-collapse collapse"><div class="accordion-body"><div id="belaegeOptions" class="option-grid"></div></div></div></div>
<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#extraPane">6. Extras</button></h2><div id="extraPane" class="accordion-collapse collapse"><div class="accordion-body"><div id="extrasOptions" class="option-grid"></div></div></div></div>
</div></div>
<div class="col-lg-5"><aside class="preview-panel p-4"><div class="preview-pizza mb-3">🍕</div><p id="pizzaPreviewText" class="text-center text-secondary">Wähle zuerst eine Größe</p><div class="row text-center border-top border-bottom py-3 mb-3"><div class="col"><div class="small text-secondary">Preis</div><div id="priceValue" class="fs-3 fw-bold text-danger">0,00 €</div></div><div class="col"><div class="small text-secondary">Kalorien</div><div id="kcalValue" class="fs-3 fw-bold">0 kcal</div></div></div><label class="form-label fw-semibold" for="couponCode">Gutscheincode</label><div class="input-group"><input id="couponCode" class="form-control" placeholder="z. B. PIZZA10"><button id="applyCoupon" class="btn btn-outline-danger" type="button">Einlösen</button></div><div id="couponAlert" class="d-none"></div><button id="saveButton" class="btn btn-danger w-100 mt-4 d-none" type="button">Konfiguration speichern</button><div id="saveAlert" class="d-none"></div><p class="small text-secondary mt-3 mb-0" data-auth-guest>Zum Speichern bitte <a href="login.html">anmelden</a>.</p></aside></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/auth.js"></script><script src="js/konfigurator.js"></script></body></html>
